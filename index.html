            top: 0;

            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.4);
            color: white;
        }

        .logo-text h1 {
            font-size: 24px;
            color: #ffffff;
            font-weight: 700;
        }

        .logo-text p {
            color: #aeaeb2;
            font-size: 13px;
            margin-top: 3px;
            font-weight: 500;
        }

        .search-container {
            padding: 16px 20px;
            background: #1c1c1e;
            border-bottom: 1px solid #38383a;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            background: #2c2c2e;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: #0a84ff;
            background: #1c1c1e;
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.25);
        }

        .filters {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            justify-content: center;
            background: #1c1c1e;
            border-bottom: 1px solid #38383a;
        }

        .filter-btn {
            padding: 6px 16px;
            border-radius: 16px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #aeaeb2;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #0a84ff;
            color: #ffffff;
            border-color: #0a84ff;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .device-card {
            background: #1c1c1e;
            border: 1px solid #38383a;
            border-radius: 16px;
            padding: 18px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .device-card:hover {
            transform: translateY(-3px);
            border-color: #0a84ff;
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.2);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .device-type {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(10, 132, 255, 0.15);
            color: #0a84ff;
        }

            font-size: 14px;
            font-weight: 700;
            color: #ff9f0a;
        }

        .device-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .device-brand {
            color: #aeaeb2;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .device-specs-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .spec-tag {
            padding: 4px 8px;
            background: #2c2c2e;
            border-radius: 8px;
            font-size: 11px;
            color: #d1d1d6;
            font-weight: 500;
        }

        .btn-details {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            background: #0a84ff;
            color: #ffffff;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-details:hover {
            background: #0062d2;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1c1c1e;
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            border: 1px solid #38383a;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: modalShow 0.3s ease;
        }

        @keyframes modalShow {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: #2c2c2e;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #38383a;
        }

        .modal-header h2 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            background: #3a3a3c;
            border: none;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #48484a;
        }

        .modal-body {
            padding: 20px;
            line-height: 1.6;
            max-height: 70vh;
            overflow-y: auto;
        }

            background: #2c2c2e;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 4px solid #0a84ff;
            border-left: 1px solid #38383a;
            border-top: 1px solid #38383a;
            border-bottom: 1px solid #38383a;
        }

            background: rgba(255, 69, 58, 0.1);

            font-weight: 700;
            font-size: 12px;

                os: 'Android 14 مع واجهة One UI ومزايا Galaxy AI', 
                build: 'إطار تيتانيوم وزجاج خلفي مطفي مع قلم S-Pen مدمج - مقاومة IP68', 
                connectivity: '5G, Wi-Fi 7, Bluetooth 5.3, NFC, UWB',
                sound: 'سماعات ستيريو AKG نقية ومحيطية',
                sensors: 'بصمة بالموجات فوق الصوتية Ultrasonic تحت الشاشة، جيروسكوب، تسارع، تقارب، بوصلة، باروميتر.',
                cons: 'السعر مرتفع جداً. / سرعة الشحن لا تزال مكتفية عند 45 واط.'
            }
        ];

        const targetBrands = ['Samsung', 'Redmi', 'Xiaomi', 'Apple'];
        const realSeriesNames = {
            'Samsung': ['Galaxy M55', 'Galaxy A73', 'Galaxy M34', 'Galaxy A24', 'Galaxy M14'],
            'Redmi': ['Redmi Note 13 Pro', 'Redmi 13C', 'Redmi Note 13', 'Redmi 12', 'Redmi A3'],
            'Xiaomi': ['Xiaomi 14', 'Xiaomi 13T Pro', 'Xiaomi Redmi K70', 'Xiaomi 12T', 'Xiaomi Civi 4'],
            'Apple': ['iPhone 14 Pro', 'iPhone 13', 'iPhone 15', 'iPhone 12', 'iPhone 14 Plus']
        };

        for(let i = 1; i <= 200; i++) {
            let b = targetBrands[i % targetBrands.length];
            let brandSeries = realSeriesNames[b];
            let seriesName = brandSeries[i % brandSeries.length];
            
            phonesData.push({
                brand: b,
                name: `${seriesName} Edition ${i}`,
                price: `${(i * 150) % 28000 + 5000} ج.م تقريباً`,
                cpu: 'معالج ثماني النواة عالي الأداء (تكنولوجيا متقدمة)',
                cpuCores: '8 أنوية: 2 أنوية بسرعة 2.4 GHz + 6 أنوية بسرعة 2.0 GHz',
                cpuScore: `${(7.6 + (i % 20) * 0.1).toFixed(1)} / 10`,
                gpu: 'معالج رسوميات (GPU) قياسي يدعم التطبيقات بسلاسة',
                screen: 'شاشة متطورة عالية الدقة مع معدل تحديث سريع وسطوع ممتاز',
                displayScore: `${(8.1 + (i % 15) * 0.1).toFixed(1)} / 10`,
                mem: i % 2 === 0 ? '256GB / 8GB RAM' : '128GB / 6GB RAM',
                cam: 'كاميرا خلفية متعددة العدسات بدقة عالية مع معالجة صور بالذكاء الاصطناعي',
                cameraScore: `${(8.0 + (i % 18) * 0.1).toFixed(1)} / 10`,
                battery: 'بطارية بسعة 5000 مللي أمبير تدعم الشحن السريع الآمن',
                os: 'نظام تشغيل حديث ومستقر واجهة سلسة',
                build: 'تصميم هيكلي متناسق بخامات ممتازة وأنيقة',
                connectivity: '5G, Wi-Fi, Bluetooth, Type-C, NFC',
                sound: 'سماعات صوتية نقية وواضحة',
                sensors: 'بصمة أصبع، جيروسكوب عتادي، تسارع، تقارب، بوصلة.',
                cons: 'لا يدعم كارت ميموري خارجي. / أداء الكاميرا الواسعة متوسط في الإضاءة الضعيفة.'
            });
        }

        const grid = document.getElementById('devicesGrid');

        function displayPhones(brandFilter = 'all', searchQuery = '') {
            grid.innerHTML = '';
            phonesData.forEach(phone => {
                if (brandFilter !== 'all' && phone.brand !== brandFilter) return;
                if (searchQuery && !phone.name.toLowerCase().includes(searchQuery) && !phone.brand.toLowerCase().includes(searchQuery)) return;

                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div>
                        <div class="device-header">
                            <span class="device-type">${phone.brand}</span>
                            <span class="device-price">${phone.price}</span>
                        </div>
                        <div class="device-name">${phone.name}</div>
                        <div class="device-brand">الماركة: ${phone.brand}</div>
                        <div class="device-specs-preview">
                            <span class="spec-tag">${phone.cpu.split(' - ')[0]}</span>
                            <span class="spec-tag">${phone.mem}</span>
                        </div>
                    </div>
                    <button class="btn-details" onclick="showModal(
                        '${phone.name}', '${phone.brand}', '${phone.price}', 
                        '${phone.cpu}', '${phone.cpuCores}', '${phone.cpuScore || '8.5 / 10'}', '${phone.gpu || 'معالج رسوميات قياسي'}', 
                        '${phone.screen}', '${phone.displayScore || '8.8 / 10'}', '${phone.mem}', 
                        '${phone.cam}', '${phone.cameraScore || '8.5 / 10'}', '${phone.battery}', 
                        '${phone.os}', '${phone.build}', '${phone.connectivity || '5G, Wi-Fi, Bluetooth'}', 
                        '${phone.sound || 'سماعات ستيريو'}', '${phone.sensors}', '${phone.cons}'
                    )">عرض التفاصيل والتقييمات والعيوب الكاملة</button>
                `;
                grid.appendChild(card);
            });
        }

        displayPhones();

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            const activeBrand = document.querySelector('.filter-btn.active').getAttribute('data-brand');
            displayPhones(activeBrand, val);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const brand = e.target.getAttribute('data-brand');
                const val = document.getElementById('searchInput').value.toLowerCase().trim();
                displayPhones(brand, val);
            });
        });

        const modal = document.getElementById('detailsModal');
        window.showModal = function(name, brand, price, cpu, cpuCores, cpuScore, gpu, screen, displayScore, mem, cam, cameraScore, battery, os, build, connectivity, sound, sensors, cons) {
            document.getElementById('modalTitle').innerText = name + " (" + brand + ")";
            document.getElementById('modalBody').innerHTML = `
                <div class="spec-row"><div class="spec-label">الماركة (Brand)</div><div class="spec-val">${brand}</div></div>
                <div class="spec-row"><div class="spec-label">السعر التقديري في مصر</div><div class="spec-val">${price}</div></div>
                <div class="spec-row"><div class="spec-label">المعالج الرئيسي (CPU)</div><div class="spec-val">${cpu}</div></div>
                <div class="spec-row"><div class="spec-label">ترددات الأنوية الرقمية (CPU Cores & GHz)</div><div class="spec-val" style="color: #0a84ff; font-weight: bold;">${cpuCores}</div></div>
                <div class="spec-row"><div class="spec-label">⭐ تقييم المعالج والأداء</div><div class="spec-val" style="color: #ff9f0a; font-weight: bold;">${cpuScore}</div></div>
                <div class="spec-row"><div class="spec-label">معالج الرسوميات (GPU)</div><div class="spec-val">${gpu}</div></div>
                <div class="spec-row"><div class="spec-label">الشاشة (Display)</div><div class="spec-val">${screen}</div></div>
                <div class="spec-row"><div class="spec-label">⭐ تقييم الشاشة والسطوع</div><div class="spec-val" style="color: #ff9f0a; font-weight: bold;">${displayScore}</div></div>
                <div class="spec-row"><div class="spec-label">الذاكرة والرام (RAM & Storage)</div><div class="spec-val">${mem}</div></div>
                <div class="spec-row"><div class="spec-label">الكاميرات (Cameras)</div><div class="spec-val">${cam}</div></div>
                <div class="spec-row"><div class="spec-label">⭐ تقييم الكاميرات والتصوير</div><div class="spec-val" style="color: #ff9f0a; font-weight: bold;">${cameraScore}</div></div>
                <div class="spec-row"><div class="spec-label">البطارية والشحن (Battery)</div><div class="spec-val">${battery}</div></div>
                <div class="spec-row"><div class="spec-label">نظام التشغيل (OS)</div><div class="spec-val">${os}</div></div>
                <div class="spec-row"><div class="spec-label">خامات التصنيع والتصميم (Build)</div><div class="spec-val">${build}</div></div>
                <div class="spec-row"><div class="spec-label">الاتصال والشبكات (Connectivity)</div><div class="spec-val">${connectivity}</div></div>
                <div class="spec-row"><div class="spec-label">الصوتيات وسماعات الـ Stereo</div><div class="spec-val">${sound}</div></div>
                <div class="spec-row"><div class="spec-label">المستشعرات الكاملة والدقيقة (Sensors)</div><div class="spec-val">${sensors}</div></div>
                <div class="spec-row cons-row"><div class="spec-label">⚠️ عيوب الهاتف وسلبياته (Cons)</div><div class="spec-val" style="color: #ff453a;">${cons}</div></div>
            `;
            modal.style.display = 'flex';
        }

        document.getElementById('closeModal').addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    </script>
</body>
</html>
